<title>MEDSUN</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    max-width:480px;
    margin:auto;
    min-height:100vh;
    border:1px solid #2a1200;
    border-radius:30px;
    overflow:hidden;
}

.hero{
    padding:50px 30px;
    text-align:center;
}

.logo{
    color:#ff6a00;
    font-size:64px;
    font-weight:900;
    letter-spacing:6px;
}

.subtitle{
    color:#00aaff;
    letter-spacing:5px;
    margin-top:10px;

}

.tagline{
    margin-top:40px;
    font-size:24px;
    line-height:1.5;
    font-style:italic;
}

.tagline span{
    color:#ff6a00;
}

.links{
    padding:20px;
}

.card{
    border:1px solid #2a1200;
    border-radius:25px;
    padding:25px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    text-decoration:none;
    color:white;
    transition:0.3s;
}

.card:hover{
    background:#111;
    transform:translateY(-3px);
}

.label{
    color:#999;
    margin-bottom:8px;
    font-size:18px;
}

.value{
    font-size:20px;
    font-weight:bold;
}

.arrow{
    color:#ff6a00;
    font-size:28px;
}

.footer{
    text-align:center;
    padding:40px;
    color:#777;
}
</style>
</head>
