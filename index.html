<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MEDSUN</title>

  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#000;
      color:white;
      display:flex;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:#0a0a0a;
      border:1px solid rgba(255,115,0,.2);
      border-radius:32px;
      overflow:hidden;
      box-shadow:0 0 40px rgba(255,115,0,.15);
    }

    .hero{
      text-align:center;
      padding:50px 25px 35px;
      border-bottom:1px solid rgba(255,115,0,.15);
    }

    .logo{
      font-size:52px;
      font-weight:900;
      color:#ff6a00;
      letter-spacing:6px;
    }

    .sub{
      color:#00b7ff;
      margin-top:8px;
      letter-spacing:4px;
      text-transform:uppercase;
      font-size:14px;
    }

    .slogan{
      margin-top:35px;
      font-size:26px;
      line-height:1.5;
      font-style:italic;
    }

    .accent{
      color:#ff7a00;
    }

    .buttons{
      padding:25px;
    }

    .btn{
      display:flex;
      justify-content:space-between;
      align-items:center;
      text-decoration:none;
      color:white;
      background:#111;
      border:1px solid rgba(255,115,0,.2);
      border-radius:22px;
      padding:18px;
      margin-bottom:16px;
      transition:.2s;
    }

    .btn:hover{
      background:#1a1a1a;
    }

    .label{
      font-size:14px;
      opacity:.8;
      margin-bottom:4px;
    }

    .value{
      font-size:20px;
      font-weight:700;
    }

    .arrow{
      color:#ff7a00;
      font-size:24px;
    }

    .footer{
      text-align:center;
      color:#777;
      padding:25px;
      border-top:1px solid rgba(255,115,0,.1);
    }
  </style>
</head>

<body>

<div class="card">

  <div class="hero">
    <div class="logo">MEDSUN</div>

    <div class="sub">
      центр здоров’я
    </div>

    <div class="slogan">
      Бути здоровим —
      <span class="accent">
        означає бути вільним!
      </span>
    </div>
  </div>

  <div class="buttons">

    <a class="btn" href="https://wa.me/380674304704">
      <div>
        <div class="label">WhatsApp</div>
        <div class="value">+380 67 430 47 04</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a class="btn" href="https://instagram.com/medsunclinics">
      <div>
        <div class="label">Instagram</div>
        <div class="value">@medsunclinics</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a class="btn" href="https://medsunclinic.com.ua">
      <div>
        <div class="label">Сайт</div>
        <div class="value">medsunclinic.com.ua</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a class="btn" href="https://t.me/Medsun_bot">
      <div>
        <div class="label">Telegram бот</div>
        <div class="value">@Medsun_bot</div>
      </div>
      <div class="arrow">→</div>
    </a>

    <a class="btn" href="https://maps.app.goo.gl/LRe23mYXUYmch2W76">
      <div>
        <div class="label">Локація</div>
        <div class="value">м. Вінниця</div>
      </div>
      <div class="arrow">→</div>
    </a>

  </div>

  <div class="footer">
    © MEDSUN — Центр здоров’я
  </div>

</div>

</body>
</html>
